# SPIRIT phone CM5 kernel fragment (linux-raspberrypi 6.12 / rpi-6.12.y).
#
# Non-boot peripherals are =m. None of this is required to reach a console;
# leave them modular until pinmux is known and hardware is tested.
#
# Symbols verified against raspberrypi/linux rpi-6.12.y Kconfig (public).
# See KERNEL.md for remaining work.

# Quectel EG25-G USB modem (issue #8). USB, not a platform bus.
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_OPTION=m
CONFIG_USB_NET_QMI_WWAN=m

# SPH0645LM4H-B I2S MEMS mic (issue #7) - uses the ICS43432-compatible driver.
CONFIG_SND_SOC_ICS43432=m

# TLV320AIC3204 (issue #6) - AIC32x4 family, I2C control + I2S audio.
# CONFIG_SND_SOC_TLV320AIC32X4 is selected by the I2C frontend.
# CONFIG_SND_SOC_TLV320AIC3X is a different (older) family; do not use it here.
CONFIG_SND_SOC_TLV320AIC32X4_I2C=m

# BQ25792 charger (issue #5).
# linux-raspberrypi 6.12 does NOT define CONFIG_REGULATOR_BQ25792,
# CONFIG_CHARGER_BQ25792, CONFIG_CHARGER_BQ257XX, CONFIG_MFD_BQ257XX, or
# CONFIG_REGULATOR_BQ257XX. Those arrived in mainline 6.18+.
# Do not set unknown symbols in this fragment (kconfig would warn/fail).
# After a kernel bump or backport, enable e.g.:
#   CONFIG_MFD_BQ257XX=m
#   CONFIG_CHARGER_BQ257XX=m
#   CONFIG_REGULATOR_BQ257XX=m

# TPS650250 (issue #4): no upstream Kconfig. Closest is tps65023
# (CONFIG_REGULATOR_TPS65023) if the schematic's TPS65023B is used.
# Left unset until the I2C bus and part choice are confirmed.
